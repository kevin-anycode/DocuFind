<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" role="img" aria-label="DocuFind 处理流程：拖入文件 → 解析切片 → 建索引 → 混合召回 → 融合定位">
  <title>DocuFind 处理流程：拖入文件 → 解析切片 → 建索引 → 混合召回 → 融合定位</title>
  <defs>
    <clipPath id="frame2">
      <rect width="1200" height="220" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame2)">
    <rect width="1200" height="220" fill="#0C0F12"/>

    <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, sans-serif" text-anchor="middle">
      <!-- 1 -->
      <rect x="42" y="66" width="196" height="92" rx="12" fill="#14181D" stroke="#252C33"/>
      <text x="140" y="112" font-size="21" fill="#EEF1F4">拖入文件</text>
      <text x="140" y="138" font-size="15" fill="#8A949E">PDF · Word · PPT</text>

      <!-- 2 -->
      <rect x="272" y="66" width="196" height="92" rx="12" fill="#14181D" stroke="#252C33"/>
      <text x="370" y="112" font-size="21" fill="#EEF1F4">解析 + 切片</text>
      <text x="370" y="138" font-size="15" fill="#8A949E">≈450 字 · 60 重叠</text>

      <!-- 3 -->
      <rect x="502" y="66" width="196" height="92" rx="12" fill="#14181D" stroke="#252C33"/>
      <text x="600" y="112" font-size="21" fill="#EEF1F4">建索引</text>
      <text x="600" y="138" font-size="15" fill="#8A949E">向量 + FTS5</text>

      <!-- 4 -->
      <rect x="732" y="66" width="196" height="92" rx="12" fill="#14181D" stroke="#252C33"/>
      <text x="830" y="112" font-size="21" fill="#EEF1F4">混合召回</text>
      <text x="830" y="138" font-size="15" fill="#8A949E">余弦 + 关键词</text>

      <!-- 5 -->
      <rect x="962" y="66" width="196" height="92" rx="12" fill="#161C22" stroke="#33506A"/>
      <text x="1060" y="112" font-size="21" fill="#D8ECFA">融合定位</text>
      <text x="1060" y="138" font-size="15" fill="#7FB6D6">RRF + 门槛</text>

      <!-- 箭头 -->
      <g stroke="#39434C" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 244 112 h 16"/><path d="M 255 107 l 6 5 -6 5"/>
        <path d="M 474 112 h 16"/><path d="M 485 107 l 6 5 -6 5"/>
        <path d="M 704 112 h 16"/><path d="M 715 107 l 6 5 -6 5"/>
        <path d="M 934 112 h 16"/><path d="M 945 107 l 6 5 -6 5"/>
      </g>
    </g>

    <!-- 底部注释 -->
    <text x="600" y="196" text-anchor="middle"
          font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, sans-serif"
          font-size="16" fill="#6E7883">只有两路都不够像时，面板才会显示“没有找到”</text>
  </g>
</svg>
